<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main background circle -->
  <rect width="200" height="200" rx="40" fill="#001a4d"/>
  
  <!-- Left sidebar -->
  <rect x="15" y="30" width="40" height="140" rx="8" fill="#1e3a5f"/>
  
  <!-- Home icon -->
  <g transform="translate(35, 45)">
    <path d="M 0 8 L 8 0 L 16 8 L 16 16 L 0 16 Z" fill="#e8f0fe" stroke="#e8f0fe" stroke-width="1.5"/>
  </g>
  
  <!-- Bar chart icon -->
  <g transform="translate(30, 70)">
    <rect x="2" y="10" width="3" height="6" fill="#b0bec5"/>
    <rect x="7" y="6" width="3" height="10" fill="#b0bec5"/>
    <rect x="12" y="2" width="3" height="14" fill="#b0bec5"/>
  </g>
  
  <!-- List icon -->
  <g transform="translate(28, 105)">
    <circle cx="2" cy="2" r="1.5" fill="#b0bec5"/>
    <line x1="5" y1="2" x2="16" y2="2" stroke="#b0bec5" stroke-width="1"/>
    <circle cx="2" cy="8" r="1.5" fill="#b0bec5"/>
    <line x1="5" y1="8" x2="16" y2="8" stroke="#b0bec5" stroke-width="1"/>
  </g>
  
  <!-- Pie chart icon -->
  <g transform="translate(28, 135)">
    <circle cx="5" cy="5" r="4" fill="#b0bec5"/>
  </g>
  
  <!-- User icon -->
  <g transform="translate(28, 160)">
    <circle cx="5" cy="2" r="2" fill="#b0bec5"/>
    <path d="M 0 5 Q 0 4 5 4 Q 10 4 10 5 L 10 7 Q 10 8 5 8 Q 0 8 0 7 Z" fill="#b0bec5"/>
  </g>
  
  <!-- Right content area -->
  <!-- Line chart card -->
  <rect x="70" y="30" width="115" height="60" rx="8" fill="#ffffff"/>
  <g transform="translate(75, 35)">
    <text x="0" y="8" font-size="6" fill="#90caf9">Chart</text>
    <polyline points="0,20 10,15 20,18 30,10 40,12 50,5" fill="none" stroke="#2196f3" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="1.5" fill="#2196f3"/>
    <circle cx="10" cy="15" r="1.5" fill="#2196f3"/>
    <circle cx="20" cy="18" r="1.5" fill="#2196f3"/>
    <circle cx="30" cy="10" r="1.5" fill="#2196f3"/>
    <circle cx="40" cy="12" r="1.5" fill="#2196f3"/>
    <circle cx="50" cy="5" r="1.5" fill="#2196f3"/>
  </g>
  
  <!-- Pie chart card -->
  <rect x="70" y="105" width="50" height="65" rx="8" fill="#ffffff"/>
  <circle cx="97" cy="137" r="20" fill="none" stroke="#2196f3" stroke-width="8" stroke-dasharray="31.4 94.2" transform="rotate(-90 97 137)"/>
  <circle cx="97" cy="137" r="20" fill="none" stroke="#26c6da" stroke-width="8" stroke-dasharray="31.4 94.2" stroke-dashoffset="-31.4" transform="rotate(-90 97 137)"/>
  <circle cx="97" cy="137" r="10" fill="#ffffff"/>
  
  <!-- List/items card -->
  <rect x="130" y="105" width="55" height="65" rx="8" fill="#ffffff"/>
  <g transform="translate(138, 115)">
    <circle cx="3" cy="3" r="2" fill="#2196f3"/>
    <line x1="8" y1="3" x2="42" y2="3" stroke="#cfd8dc" stroke-width="1"/>
    <circle cx="3" cy="16" r="2" fill="#26c6da"/>
    <line x1="8" y1="16" x2="42" y2="16" stroke="#cfd8dc" stroke-width="1"/>
    <circle cx="3" cy="29" r="2" fill="#ff9800"/>
    <line x1="8" y1="29" x2="42" y2="29" stroke="#cfd8dc" stroke-width="1"/>
  </g>
</svg>
